<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Sozialzync</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>*{font-family:'Plus Jakarta Sans',sans-serif;}input:focus{outline:none;border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.12);}</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#F4F3FB]">
<div class="w-full max-w-[420px] mx-4">
  <div class="flex justify-center mb-8">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:linear-gradient(135deg,#a78bfa,#7C3AED)"><i data-lucide="zap" class="w-5 h-5 text-white"></i></div>
      <span class="font-extrabold text-gray-900 text-xl">Sozialzync</span>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-[#ECECF3] p-8 shadow-sm">
    <a href="login.html" class="flex items-center gap-1.5 text-sm text-gray-400 hover:text-gray-700 mb-6 transition-colors">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to login
    </a>

    <div class="w-14 h-14 rounded-2xl flex items-center justify-center mb-5" style="background:linear-gradient(135deg,#a78bfa20,#7C3AED20)">
      <i data-lucide="key-round" class="w-7 h-7 text-purple-600"></i>
    </div>

    <h1 class="text-2xl font-extrabold text-gray-900 mb-2">Reset your password</h1>
    <p class="text-gray-400 text-sm mb-7">Enter your email and we'll send you a reset link or OTP code.</p>

    <!-- Step 1: Email -->
    <div id="step-email">
      <form class="space-y-4" onsubmit="showOtp(event)">
        <input type="email" placeholder="Email address" value="creator@example.com" class="w-full px-4 py-3 rounded-xl border text-sm text-gray-900 placeholder-gray-400" style="border:1.5px solid #ece8f8">
        <div class="flex gap-3">
          <button type="button" class="flex-1 py-3 rounded-xl border border-gray-200 text-gray-700 font-semibold text-sm hover:bg-gray-50 transition-all flex items-center justify-center gap-2">
            <i data-lucide="mail" class="w-4 h-4"></i> Email link
          </button>
          <button type="submit" class="flex-1 py-3 rounded-xl text-white font-bold text-sm transition-all hover:opacity-90 flex items-center justify-center gap-2" style="background:linear-gradient(135deg,#a78bfa,#7C3AED)">
            <i data-lucide="hash" class="w-4 h-4"></i> Send OTP
          </button>
        </div>
      </form>
    </div>

    <!-- Step 2: OTP -->
    <div id="step-otp" class="hidden">
      <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-3 mb-5 flex items-center gap-2">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500 flex-shrink-0"></i>
        <span class="text-sm text-emerald-700">OTP sent to <strong>creator@example.com</strong></span>
      </div>
      <p class="text-sm text-gray-500 mb-4">Enter the 6-digit code from your email</p>
      <div class="flex gap-2 justify-center mb-5">
        <input maxlength="1" value="4" class="w-12 h-12 text-center rounded-xl border text-lg font-bold text-gray-900" style="border:1.5px solid #ece8f8">
        <input maxlength="1" value="8" class="w-12 h-12 text-center rounded-xl border text-lg font-bold text-gray-900" style="border:1.5px solid #ece8f8">
        <input maxlength="1" value="2" class="w-12 h-12 text-center rounded-xl border text-lg font-bold text-gray-900" style="border:1.5px solid #ece8f8">
        <input maxlength="1" class="w-12 h-12 text-center rounded-xl border text-lg font-bold" style="border:1.5px solid #7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.12)">
        <input maxlength="1" class="w-12 h-12 text-center rounded-xl border text-lg font-bold" style="border:1.5px solid #ece8f8">
        <input maxlength="1" class="w-12 h-12 text-center rounded-xl border text-lg font-bold" style="border:1.5px solid #ece8f8">
      </div>
      <button class="w-full py-3 rounded-xl text-white font-bold text-sm mb-3" style="background:linear-gradient(135deg,#a78bfa,#7C3AED)">Verify Code</button>
      <div class="text-center">
        <button onclick="showEmail()" class="text-sm text-gray-400 hover:text-gray-600">Resend code (54s)</button>
      </div>

      <!-- New password fields (revealed after OTP) -->
      <div class="mt-5 space-y-3 border-t border-gray-100 pt-5">
        <p class="text-sm font-semibold text-gray-700">Set new password</p>
        <input type="password" placeholder="New password" class="w-full px-4 py-3 rounded-xl border text-sm" style="border:1.5px solid #ece8f8">
        <input type="password" placeholder="Confirm new password" class="w-full px-4 py-3 rounded-xl border text-sm" style="border:1.5px solid #ece8f8">
        <button class="w-full py-3 rounded-xl text-white font-bold text-sm" style="background:linear-gradient(135deg,#a78bfa,#7C3AED)">Reset Password</button>
      </div>
    </div>
  </div>

  <p class="text-center mt-4"><a href="../index.html" class="text-xs text-gray-400 hover:text-gray-600">← Design Index</a></p>
</div>
<script>
function showOtp(e){e.preventDefault();document.getElementById('step-email').classList.add('hidden');document.getElementById('step-otp').classList.remove('hidden');}
function showEmail(){document.getElementById('step-email').classList.remove('hidden');document.getElementById('step-otp').classList.add('hidden');}
if(window.lucide)lucide.createIcons();
</script>
</body>
</html>
