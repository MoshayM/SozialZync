version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: creatorforce
      POSTGRES_USER: cf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cf -d creatorforce"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API (NestJS) ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cf:${POSTGRES_PASSWORD:-changeme}@postgres:5432/creatorforce
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      PROVIDER_KEY_SECRET: ${PROVIDER_KEY_SECRET}
      WEB_URL: ${WEB_URL:-http://localhost:3007}
      API_URL: ${API_URL:-http://api:4007/api/v1}
      # Self-hosted AI providers (optional)
      OLLAMA_URL: ${OLLAMA_URL:-}
      COMFYUI_URL: ${COMFYUI_URL:-}
      A1111_URL: ${A1111_URL:-}
      KOKORO_URL: ${KOKORO_URL:-}
      PIPER_URL: ${PIPER_URL:-}
      STORAGE_BASE_PATH: /data/sozialzync
    volumes:
      - ai_storage:/data/sozialzync
    ports:
      - "4007:4007"

  # ── Web (Next.js) ─────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4007/api/v1}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4007/api/v1}
    ports:
      - "3007:3007"

volumes:
  postgres_data:
  redis_data:
  ai_storage:
