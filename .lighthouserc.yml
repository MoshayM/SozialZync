ci:
  collect:
    url:
      - https://sozialzynk.vercel.app/
      - https://sozialzynk.vercel.app/login
    numberOfRuns: 2
    settings:
      chromeFlags: '--no-sandbox --disable-dev-shm-usage'

  assert:
    assertions:
      'categories:performance':
        - warn
        - minScore: 0.5
      'categories:accessibility':
        - error
        - minScore: 0.8
      'categories:best-practices':
        - warn
        - minScore: 0.8
      'categories:seo':
        - warn
        - minScore: 0.8
      'first-contentful-paint':
        - warn
        - maxNumericValue: 3000
      'largest-contentful-paint':
        - warn
        - maxNumericValue: 4000
      'total-blocking-time':
        - warn
        - maxNumericValue: 500
      'cumulative-layout-shift':
        - warn
        - maxNumericValue: 0.1

  upload:
    target: temporary-public-storage
