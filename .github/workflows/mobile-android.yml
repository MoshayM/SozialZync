name: Mobile — Android Build

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build signed release AAB (requires keystore secrets)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Debug APK — fast feedback on every master push ──────────────────────────
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Add Android platform
        run: pnpm add:android
        working-directory: apps/mobile

      - name: Patch AndroidManifest — permissions + App Links
        run: |
          MANIFEST="apps/mobile/android/app/src/main/AndroidManifest.xml"

          # 1. Mic / audio permissions
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|' "$MANIFEST"

          # 2. App Links intent filter — routes sozialzynk.vercel.app back into the
          #    Capacitor WebView after OAuth / push-notification deep links.
          #    android:autoVerify lets Android verify ownership via assetlinks.json so
          #    the app becomes the *default* handler (no disambiguation dialog) on all
          #    devices including OnePlus / OxygenOS.
          python3 - <<'PYEOF'
          import re, sys

          path = "apps/mobile/android/app/src/main/AndroidManifest.xml"
          xml  = open(path).read()

          app_links = """
              <intent-filter android:autoVerify="true">
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="https" android:host="sozialzynk.vercel.app" />
              </intent-filter>"""

          # Insert after the LAUNCHER intent-filter closing tag inside MainActivity
          patched = xml.replace(
              '<category android:name="android.intent.category.LAUNCHER" />\n        </intent-filter>',
              '<category android:name="android.intent.category.LAUNCHER" />\n        </intent-filter>' + app_links,
              1,
          )

          if patched == xml:
              print("WARNING: LAUNCHER intent-filter not found — skipping App Links patch", file=sys.stderr)
          else:
              open(path, "w").write(patched)
              print("App Links intent-filter added.")
          PYEOF

          echo "--- Patched manifest ---"
          cat "$MANIFEST"

      - name: Restore stable debug keystore
        # Uses a stable keystore stored as a CI secret so the SHA-256 fingerprint
        # stays consistent across builds and matches the assetlinks.json entry.
        # If the secret is absent (first-time setup), Android Gradle generates a
        # fresh debug keystore and the step is a no-op.
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Stable debug keystore restored."
          else
            echo "ANDROID_DEBUG_KEYSTORE_BASE64 not set — using auto-generated keystore."
          fi
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}

      - name: Generate launcher icons
        run: pnpm generate:icons
        working-directory: apps/mobile

      - name: Create dist placeholder
        run: mkdir -p dist
        working-directory: apps/mobile

      - name: Build debug APK
        run: pnpm build:android
        working-directory: apps/mobile

      - name: Rename APK
        run: mv apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk apps/mobile/android/app/build/outputs/apk/debug/sozialzynk.apk

      - name: Log APK signing fingerprint
        run: |
          APK="apps/mobile/android/app/build/outputs/apk/debug/sozialzynk.apk"
          unzip -p "$APK" META-INF/CERT.RSA | \
            openssl pkcs7 -inform DER -print_certs -noout -fingerprint -sha256 2>/dev/null \
            || echo "(openssl unavailable — fingerprint not logged)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sozialzync-android-debug-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/sozialzynk.apk
          retention-days: 14

      - name: Remove app-debug.apk from release
        run: gh release delete-asset android-latest app-debug.apk --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK to GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android APK (latest)
          body: |
            Latest debug APK built from `${{ github.sha }}`.
            Install on Android — enable "Install from unknown sources" first.
          files: apps/mobile/android/app/build/outputs/apk/debug/sozialzynk.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Release AAB — signed, ready for Google Play Console upload ──────────────
  android-release:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    # Only on manual dispatch with build_release=true, or when tag is pushed.
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_release == 'true') ||
      startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Add Android platform
        run: pnpm add:android
        working-directory: apps/mobile

      - name: Patch AndroidManifest — permissions + App Links
        run: |
          MANIFEST="apps/mobile/android/app/src/main/AndroidManifest.xml"

          # 1. Mic / audio permissions
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|' "$MANIFEST"

          # 2. App Links intent filter
          python3 - <<'PYEOF'
          import re, sys

          path = "apps/mobile/android/app/src/main/AndroidManifest.xml"
          xml  = open(path).read()

          app_links = """
              <intent-filter android:autoVerify="true">
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="https" android:host="sozialzynk.vercel.app" />
              </intent-filter>"""

          patched = xml.replace(
              '<category android:name="android.intent.category.LAUNCHER" />\n        </intent-filter>',
              '<category android:name="android.intent.category.LAUNCHER" />\n        </intent-filter>' + app_links,
              1,
          )

          if patched == xml:
              print("WARNING: LAUNCHER intent-filter not found — skipping App Links patch", file=sys.stderr)
          else:
              open(path, "w").write(patched)
              print("App Links intent-filter added.")
          PYEOF

          echo "--- Patched manifest ---"
          cat "$MANIFEST"

      - name: Generate launcher icons
        run: pnpm generate:icons
        working-directory: apps/mobile

      - name: Create dist placeholder
        run: mkdir -p dist
        working-directory: apps/mobile

      - name: Decode release keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build release AAB
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_STORE_PASS }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASS }}
        working-directory: apps/mobile

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sozialzync-android-release-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -f apps/mobile/android/app/release.keystore
