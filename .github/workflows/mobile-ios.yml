name: Mobile — iOS Build

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile

      - name: Add iOS platform
        run: pnpm add:ios
        working-directory: apps/mobile

      - name: Sync Capacitor
        run: pnpm sync
        working-directory: apps/mobile

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: apps/mobile/ios/App

      - name: Build iOS simulator archive (unsigned)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
        working-directory: apps/mobile

      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v4
        with:
          name: sozialzync-ios-simulator-${{ github.sha }}
          path: apps/mobile/ios-build/Build/Products/Release-iphonesimulator/
          retention-days: 14

  # ── App Store IPA — only on manual dispatch with Apple certificates ──────────
  ios-release:
    name: Build App Store IPA
    runs-on: macos-latest
    # Only when triggered manually with Apple signing secrets configured.
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile

      - name: Add iOS platform
        run: pnpm add:ios
        working-directory: apps/mobile

      - name: Sync Capacitor
        run: pnpm sync
        working-directory: apps/mobile

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: apps/mobile/ios/App

      - name: Import Apple distribution certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASS: ${{ secrets.APPLE_CERTIFICATE_PASS }}
        run: |
          CERT_PATH=$(mktemp -d)/certificate.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          KEYCHAIN_PATH=$(mktemp -d)/app.keychain
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Import provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$(mktemp -d)/profile.mobileprovision
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive iOS app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ios-archive/App.xcarchive \
            archive
        working-directory: apps/mobile

      - name: Export IPA
        run: |
          cat > export-options.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath ios-archive/App.xcarchive \
            -exportPath ios-ipa \
            -exportOptionsPlist export-options.plist
        working-directory: apps/mobile

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sozialzync-ios-release-${{ github.sha }}
          path: apps/mobile/ios-ipa/
          retention-days: 30
