[build]
buildCommand = "pnpm install --no-frozen-lockfile && pnpm --filter @cf/shared build && pnpm --filter @cf/api build"

[deploy]
startCommand = "cd /app/apps/api && npx prisma migrate resolve --rolled-back 20260805000001_add_character_model 2>/dev/null || true && npx prisma migrate deploy && node dist/main"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
