[build]
buildCommand = "pnpm install --no-frozen-lockfile && pnpm --filter @cf/shared build && pnpm --filter @cf/api build"

[deploy]
startCommand = "set -ex && echo PORT=$PORT && echo NODE_ENV=$NODE_ENV && cd /app/apps/api && echo 'running migrate...' && npx prisma migrate deploy && echo 'starting node...' && node dist/main"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
