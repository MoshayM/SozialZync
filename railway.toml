[build]
buildCommand = "pnpm install --no-frozen-lockfile && pnpm --filter @cf/shared build && pnpm --filter @cf/api build"

[deploy]
startCommand = "npx --prefix /app/apps/api prisma migrate deploy --schema /app/apps/api/prisma/schema.prisma || echo 'migrate warning — continuing' && node /app/apps/api/dist/main"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
