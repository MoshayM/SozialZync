global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'creatorforce-api'
    # When running in Docker Compose, use the service name instead of host.docker.internal
    static_configs:
      - targets: ['api:4007']
    metrics_path: /metrics
    scheme: http
