[build]
dockerfilePath = "../../Dockerfile"

[deploy]
startCommand = "sh -c 'cd /app/apps/api && (npx prisma migrate resolve --rolled-back 20260915000001_add_platform_watch_readonly 2>/dev/null || true) && npx prisma migrate deploy && node dist/main'"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
