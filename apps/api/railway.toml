[build]
dockerfilePath = "../../Dockerfile"

[deploy]
startCommand = "sh -c 'cd /app/apps/api && npx prisma migrate resolve --applied 20260824000003_fix_publishing_status_enum 2>&1 || true && npx prisma migrate resolve --applied 20260915000001_add_platform_watch_readonly 2>&1 || true && npx prisma migrate deploy && node dist/main'"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
