<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#1e0a6e"/>
    </linearGradient>
    <radialGradient id="hl" cx="30%" cy="18%" r="58%">
      <stop stop-color="white" stop-opacity="0.22"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="40" height="40" rx="10" fill="url(#bg)"/>
  <rect width="40" height="40" rx="10" fill="url(#hl)"/>
  <!-- Bold geometric Z mark: square caps for solid bar ends, round joins for smooth diagonal -->
  <path d="M 10.5,13 H 29.5 L 10.5,27 H 29.5"
        stroke="white" stroke-width="6.5"
        stroke-linecap="square" stroke-linejoin="round" fill="none"/>
